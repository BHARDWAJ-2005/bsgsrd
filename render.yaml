services:
  - type: web
    name: bsg-sangareddy
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn bsg_sangareddy.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DJANGO_DEBUG
        value: "False"
      - key: SECRET_KEY
        value: "secure-string-key-1810"
      - key: ALLOWED_HOSTS
        value: "*"
